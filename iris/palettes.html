<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iris colours | Middle Earth Tiles</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;background:transparent}
  body{font-family:Aptos,"Segoe UI",-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;color:#464330}
  .wrap{padding:4px 4px 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;justify-content:center}
  .more{display:none;margin-top:10px}
  .open .more{display:grid;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  a.sw{display:block;text-align:center;text-decoration:none;color:inherit;border-radius:8px;padding:6px 4px}
  a.sw:hover,a.sw:focus-visible{background:#F5F7F0;outline:none}
  a.sw img{width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;display:block}
  a.sw b{display:block;font-size:.88rem;margin-top:4px;line-height:1.2;font-weight:600}
  a.sw small{display:block;font-size:.75rem;color:#69685B}
  .bar{display:flex;justify-content:center;margin-top:14px}
  .btn{font:inherit;font-size:.95rem;font-weight:600;color:#464330;background:#fff;border:1.5px solid #464330;border-radius:999px;padding:10px 22px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .btn:hover,.btn:focus-visible{background:#464330;color:#fff;outline:none}
  .btn i{font-style:normal;font-size:1.1rem;line-height:1;transition:transform .25s}
  .open .btn i{transform:rotate(45deg)}
  .solo .bar{display:none}
  @media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:4px}a.sw{padding:4px 2px}a.sw b{font-size:.8rem}a.sw small{font-size:.7rem}}
</style>
</head>
